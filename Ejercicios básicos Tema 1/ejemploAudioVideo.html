<body>
    <h1>Multimedia en HTML</h1>

    <h2>1.Etiqueta &lt;audio8gt;</h2>
    <p>Ejemplo básico con controles visibles de Audios</p>

    <audio controls>
        <source src="dmvklnv" type="audio/ogg">
        <source src= "dmvklnv" type="audio/mp3">

        Tu navegador no soporta la reproducción de audio en formato.

    </audio>

    <h2>2. Eriqueta &lt;audio&gt;; con Autoplay y Muted</h2>
    <audio controls autoplay muted>
        <source src="audioTest.ogg/ogg" type="audio/ogg">
        <source src= "audioTest.mp3" type="audio/mp3">

        Tu navegador no soporta la reproducción de audio en formato.
    </audio>

    <h2>3. Etiqueta &lt;video&gt;</h2>
    <video width="320" height="240" controls>
        <source src="movieTest.mp4" type="video/mp4">
        <source src="videoTest.ogg" type="video/ogg">

<!--Mensaje de respaldo -->

        Tu navegador no soporta la reproducción de video mp4 ni ogg.

    </video>

    <iframe src="movieTest2.mp4" width="600" height="400" tittle="Descripción del vídeo"></iframe>
    

</body>
