<!DOCTYPE html>
<html>
<head>
    <title>Ejercicio 23</title>
    <style>
        table, th, td { border: 1px solid black; border-collapse: collapse; padding: 5px; }
        caption { font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h3>Navegadores Web</h3>
    <table>
        <caption>Web Browser Market Share</caption>
        <tr>
            <th>Navegador</th>
            <th>Porcentaje</th>
        </tr>
        <tr>
            <td style="background-color: #f30000;">Chrome</td>
            <td>65.3%</td>
        </tr>
        <tr>
            <td style="background-color: #00ff00;">Safari</td>
            <td>17.1%</td>
        </tr>
        <tr>
            <td style="background-color: #0000ff;">IE & Edge</td>
            <td>5.6%</td>
        </tr>
        <tr>
            <td style="background-color: #ffff00;">Firefox</td>
            <td>4.3%</td>
        </tr>
        <tr>
            <td style="background-color: #ff00ff;">Opera</td>
            <td>1.5%</td>
        </tr>
        <tr>
            <td colspan="2">Fuente: PCWorld</td>
        </tr>
    </table>
</body>
</html>
