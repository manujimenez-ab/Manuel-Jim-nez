<!DOCTYPE html>
<html>
<head>
    <title>Ejercicio 21</title>
    <style>
        table, th, td { border: 1px solid black; border-collapse: collapse; padding: 8px; text-align: center; }
    </style>
</head>
<body>
    <h3>Juego de números</h3>
    <table>
        <tr>
            <th>Número 1</th>
            <th>Número 2</th>
            <th>Número 3</th>
        </tr>
        <tr>
            <td>#1</td>
            <td>#2</td>
            <td>#3</td>
        </tr>
        <tr>
            <td colspan="3">#4</td>
        </tr>
        <tr>
            <td>#5</td>
            <td>#6</td>
            <td>
                Subtabla
                <table>
                    <tr><td>#1</td><td>#2</td></tr>
                    <tr><td>#3</td><td>#4</td></tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
